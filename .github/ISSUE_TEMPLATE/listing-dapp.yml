name: List a DApp
description: Request inclusion on the Zekion wallet Discover whitelist.
title: "[DApp] <NAME>"
labels: ["listing", "dapp", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Required: **display name**, **description**, **website / web app URL**, **app icon**.
        After maintainers label this Issue **approved**, open a PR that appends a tile to `discover/whitelist.json` and references this Issue.
  - type: input
    id: name
    attributes:
      label: App display name
      description: Name shown on the Discover tile in the Zekion wallet.
      placeholder: My App
    validations:
      required: true
  - type: input
    id: id
    attributes:
      label: Proposed tile id
      description: Lowercase slug used in catalog JSON, e.g. my-app
      placeholder: my-app
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Short blurb for reviewers (and future Discover subtitle if we add one).
    validations:
      required: true
  - type: input
    id: homepage
    attributes:
      label: Website / homepage
      placeholder: https://
    validations:
      required: true
  - type: input
    id: webapp
    attributes:
      label: Web app URL
      description: HTTPS URL opened inside the wallet browser when the user taps the tile.
      placeholder: https://app.example.com
    validations:
      required: true
  - type: input
    id: logo
    attributes:
      label: App icon (logo URL)
      description: Public HTTPS URL to a square PNG/SVG suitable for the Discover tile. Required.
      placeholder: https://…/icon.png
    validations:
      required: true
  - type: textarea
    id: chains
    attributes:
      label: Chains supported
    validations:
      required: true
  - type: checkboxes
    id: providers
    attributes:
      label: Integration surfaces
      options:
        - label: window.ethereum
        - label: window.zekion (privacy ops)
        - label: WalletConnect
  - type: textarea
    id: deeplinks
    attributes:
      label: Deep-link examples (optional)
      placeholder: zekion://browse?url=…
  - type: input
    id: contact
    attributes:
      label: Contact email
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: Testing instructions
      description: How maintainers can verify connect / SIWE / privacy flows.
    validations:
      required: true
