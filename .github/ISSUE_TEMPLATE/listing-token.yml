name: List a Token
description: Request Zekion protocol + wallet support for a token (Issue first, then catalog PR).
title: "[Token] <SYMBOL> on <CHAIN>"
labels: ["listing", "token", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Required: **website**, **description**, **contract address(es)**, **token icon**.
        After maintainers label this Issue **approved**, open a PR under `tokens/` that references this Issue.
        On-chain `configureToken` is performed by Zekion operators — merging a PR alone is not enough.
  - type: input
    id: project
    attributes:
      label: Project / issuer name
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Website
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What the token is and what it is used for (shown to reviewers; may feed wallet metadata later).
      placeholder: e.g. USD-pegged stablecoin used as the primary settlement asset on …
    validations:
      required: true
  - type: input
    id: token_name
    attributes:
      label: Token display name
      description: Full name shown in wallets (e.g. Tether USD), not only the ticker.
      placeholder: Tether USD
    validations:
      required: true
  - type: input
    id: symbol
    attributes:
      label: Token symbol (ticker)
      placeholder: USDT
    validations:
      required: true
  - type: input
    id: token_key
    attributes:
      label: Proposed tokenKey (protocol string)
      description: Short key used on-chain (e.g. USDT). Must be stable across chains for the same asset.
    validations:
      required: true
  - type: input
    id: decimals
    attributes:
      label: Decimals
    validations:
      required: true
  - type: textarea
    id: deployments
    attributes:
      label: Token contract address(es)
      description: One line per chain — chain name, SLIP-44, checksummed contract address.
      placeholder: |
        BSC · SLIP-44 714 · 0x…
        Ethereum · SLIP-44 60 · 0x…
    validations:
      required: true
  - type: input
    id: logo
    attributes:
      label: Token icon (logo URL)
      description: Public HTTPS URL to a square PNG (recommended 128×128 or 256×256, transparent background). Required for wallet display.
      placeholder: https://…/token.png
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Contact email
    validations:
      required: true
  - type: input
    id: security
    attributes:
      label: Security contact
      placeholder: security@…
    validations:
      required: true
  - type: input
    id: min_deposit
    attributes:
      label: Requested minDeposit (optional)
      description: Human units or base units — specify which.
  - type: textarea
    id: rationale
    attributes:
      label: Why list this token on Zekion?
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: Testing notes
      description: Verified explorer links, testnet faucet, sample tx hashes.
    validations:
      required: true
